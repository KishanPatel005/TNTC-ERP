# Construction ERP Management System – PHP + MySQL
# Master Prompt for VS Code AI

project_description: |
  Build a fully functional **Construction Project Management & Inventory ERP System** in **pure PHP (no MVC)** and **MySQL**.
  This system will manage construction tasks, materials, inventory, purchase orders, vendor goods receipts, attendance, and salaries.
  The system must be mobile-friendly, fast, and secure.

technical_stack:
  backend: "PHP 8+ (pure PHP, procedural + modular organization)"
  database: "MySQL (InnoDB, foreign keys, indexes for performance)"
  frontend: 
    - "HTML5"
    - "CSS3"
    - "Bootstrap 5 via CDN"
    - "Font Awesome 6 via CDN"
    - "jQuery 3.7 via CDN"
    - "DataTables via CDN"
    - "SweetAlert2 via CDN for alerts"
    - "Chart.js via CDN for dashboard analytics"
  authentication: 
    - "Login & session management with password_hash()"
    - "Role-based access (Admin, Manager, Staff)"
  security:
    - "Prepared statements for all DB queries"
    - "CSRF token in forms"
    - "Basic input validation and sanitization"
  php_libraries: "Only use external PHP library if absolutely required (e.g., PHPMailer for email notifications)"

modules:
  - name: "User Authentication"
    features:
      - Admin, Manager, Staff roles
      - Secure login/logout
      - Profile management

  - name: "Dashboard"
    features:
      - Show quick stats (Active projects, Tasks pending, Stock level, Salary due)
      - Display charts for materials usage and task progress

  - name: "Project & Task Management"
    features:
      - Create main construction projects
      - Add Main Line Task → Sub Line Task → Ground Line Task hierarchy
      - Track deadlines and status updates
      - Assign staff to tasks

  - name: "Material Requests & Stock Management"
    features:
      - Request materials for a task
      - Approve/reject requests
      - Manage Stock In / Stock Out
      - Low-stock alerts

  - name: "Purchase Orders (PO) & Goods Receipt Note (GRN)"
    features:
      - Create POs for vendors
      - Record received goods with GRN
      - Auto-update stock

  - name: "Attendance & Salary"
    features:
      - Daily attendance marking for workers
      - Salary calculation based on attendance
      - Salary payment records

  - name: "Reports"
    features:
      - Export to Excel/CSV (use PHP output buffering)
      - Task progress reports
      - Stock usage reports
      - Salary summary

database_schema:
  requirements: |
    Use MySQL with InnoDB and foreign keys.
    Optimize with indexes for large data.
    Suggested tables: users, roles, projects, main_tasks, sub_tasks, ground_tasks, material_requests, stock, stock_log, purchase_orders, grn, attendance, salary, reports.

ui_ux:
  layout: "Admin dashboard layout with sidebar navigation"
  theme: "Bootstrap 5 + custom CSS"
  icons: "Font Awesome 6"
  tables: "DataTables with search, sort, pagination"
  forms: "Bootstrap forms with client-side validation using jQuery"
  modals: "Bootstrap modals for add/edit forms"

deployment:
  - Must run on Apache + PHP + MySQL
  - config.php for DB connection
  - sql_dump.sql for database schema
  - folder structure:
      /assets (css, js, images)
      /modules (PHP files per module)
      /includes (header.php, footer.php, db.php, auth.php)
      index.php (dashboard)
      login.php
      logout.php

goal:
  Generate the entire system in a single output with:
    - Complete PHP, HTML, CSS, JS code
    - SQL schema
    - Installation steps
    - Sample test data
    - Minimal external dependencies
